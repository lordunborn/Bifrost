name: CI

# Every push to master and every pull request: the privacy check, the tests (Linux; the Windows-only tests skip themselves), and a full
# build of the Windows and Linux release files, so a broken release build shows up here and not on release day. Nothing is published.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Privacy check
        run: sh tools/check-repo-privacy.sh
      - name: Tests
        run: dotnet test OmegaLauncher.Updates.Tests --nologo -v q
      - name: Build the release files (the same script the Release workflow uses)
        shell: pwsh
        run: ./tools/package-release.ps1 -Version 0.0.1 -Out ./release
      - name: Check the release files
        run: sh tools/check-release-files.sh release
